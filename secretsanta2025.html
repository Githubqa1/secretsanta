<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Santa</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }
    h2 { text-align:center; }
    .box {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ddd;
        margin-bottom:20px;
    }
    input, button {
        padding: 10px;
        font-size: 16px;
        margin: 5px 0;
        width: 100%;
        box-sizing: border-box;
    }
    button {
        cursor: pointer;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
    }
    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }
    #resultBox {
        font-weight: bold;
        color: green;
        text-align: center;
        margin-top: 20px;
        font-size: 20px;
    }
</style>
</head>
<body>

<h2>🎅 Secret Santa Generator</h2>

<!-- ADD PARTICIPANT -->
<div class="box">
    <h3>Add Your Name</h3>
    <input id="name" placeholder="Your Name">
    <input id="wish" placeholder="Your Wish (optional)">
    <button onclick="addParticipant()" id="addBtn">Add Participant</button>
</div>

<!-- ADMIN: LOCK + RESET -->
<div class="box">
    <h3>Admin Controls</h3>
    <button onclick="lockList()" id="lockBtn">Lock List</button>
    <button onclick="resetAll()" style="background:#dc3545;margin-top:10px;">Reset Everything</button>
    <p style="color:#888; font-size:14px;">(Participants list is hidden for privacy)</p>
</div>

<!-- DRAW -->
<div class="box">
    <h3>Draw Your Secret Santa</h3>
    <button onclick="drawName()" id="drawBtn" disabled>Draw</button>
    <div id="resultBox"></div>
</div>


<script>
// ------------------ INITIAL STORAGE SETUP -------------------

let participants = JSON.parse(localStorage.getItem("ss_participants") || "[]");
let locked = JSON.parse(localStorage.getItem("ss_locked") || "false");
let drawn = JSON.parse(localStorage.getItem("ss_drawn") || "{}");

updateUI();

// ------------------ ADD PARTICIPANT -------------------

function addParticipant() {
    if (locked) return alert("List is locked already!");

    let name = document.getElementById("name").value.trim();
    let wish = document.getElementById("wish").value.trim();

    if (!name) return alert("Please enter your name.");

    // prevent duplicates case-insensitive
    if (participants.some(p => p.name.toLowerCase() === name.toLowerCase())) {
        return alert("This name is already added!");
    }

    participants.push({ name, wish });
    localStorage.setItem("ss_participants", JSON.stringify(participants));

    document.getElementById("name").value = "";
    document.getElementById("wish").value = "";
}

// ------------------ LOCK LIST -------------------

function lockList() {
    if (participants.length < 2) {
        return alert("At least 2 participants required!");
    }

    locked = true;
    localStorage.setItem("ss_locked", "true");
    updateUI();
}

// ------------------ DRAW NAME (CASE-INSENSITIVE) -------------------

function drawName() {
    let entered = prompt("Enter your name to draw:");

    if (!entered) return;

    entered = entered.trim().toLowerCase();

    let selfObj = participants.find(p => p.name.toLowerCase() === entered);

    if (!selfObj) {
        return alert("Name not found. Check your spelling.");
    }

    // Prevent multiple draws
    if (drawn[selfObj.name]) {
        return alert("You already drew: " + drawn[selfObj.name].name);
    }

    // Build valid list
    let taken = Object.values(drawn).map(d => d.name.toLowerCase());

    let possible = participants.filter(p =>
        p.name.toLowerCase() !== entered && !taken.includes(p.name.toLowerCase())
    );

    if (possible.length === 0) {
        return alert("No available names left to assign!");
    }

    // Random pick
    let pick = possible[Math.floor(Math.random() * possible.length)];

    drawn[selfObj.name] = pick;
    localStorage.setItem("ss_drawn", JSON.stringify(drawn));

    document.getElementById("resultBox").innerText =
        "🎁 You got: " + pick.name + (pick.wish ? " — Wish: " + pick.wish : "");
}

// ------------------ RESET EVERYTHING -------------------

function resetAll() {
    if (!confirm("Reset all data?")) return;

    localStorage.removeItem("ss_participants");
    localStorage.removeItem("ss_locked");
    localStorage.removeItem("ss_drawn");

    participants = [];
    locked = false;
    drawn = {};

    updateUI();
    alert("Reset completed.");
}

// ------------------ UPDATE UI -------------------

function updateUI() {
    document.getElementById("addBtn").disabled = locked ? true : false;
    document.getElementById("lockBtn").disabled = locked ? true : false;
    document.getElementById("drawBtn").disabled = locked ? false : true;
}
</script>

</body>
</html>
